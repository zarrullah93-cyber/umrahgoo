<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📋 Pilihan Panduan</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #e8f5e9 0%, #c8e6c9 100%);
            min-height: 100vh;
            padding: 40px 20px;
            max-width: 600px;
            margin: 0 auto;
        }

        /* Animasi muncul */
        .fade-up {
            opacity: 0;
            transform: translateY(25px);
            animation: fadeUp 0.8s ease-out forwards;
        }
        h2 { animation-delay: 0.1s; }
        .intro { animation-delay: 0.25s; }
        .btn-container a:nth-child(1) { animation-delay: 0.35s; }
        .btn-container a:nth-child(2) { animation-delay: 0.45s; }
        .btn-container a:nth-child(3) { animation-delay: 0.55s; }
        .btn-container a:nth-child(4) { animation-delay: 0.65s; }
        .btn-back { animation-delay: 0.8s; }

        @keyframes fadeUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h2 { color: #2e7d32; text-align: center; margin-bottom: 10px; font-size: 1.8rem; }
        .intro { text-align: center; color: #555; margin-bottom: 30px; }
        .btn-container { display: flex; flex-direction: column; gap: 12px; margin-bottom: 40px; }
        .btn {
            padding: 16px 24px;
            font-size: 1rem;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            background: #2e7d32;
            color: white;
            transition: all 0.3s ease;
            text-decoration: none;
            display: block;
            text-align: center;
        }
        .btn:hover {
            background: #1b5e20;
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 6px 20px rgba(46, 125, 50, 0.25);
        }
        .btn-back {
            background: transparent;
            border: 2px solid #2e7d32;
            color: #2e7d32;
        }
        .btn-back:hover {
            background: #2e7d32;
            color: white;
        }
    </style>
</head>
<body>
    <h2 class="fade-up">📋 Pilihan Panduan</h2>
    <p class="intro fade-up">Sila pilih bahagian yang ingin anda rujuk:</p>

<div class="btn-container">
    <a href="barang.html" class="btn">🎒 Senarai Kelengkapan & Keperluan</a>
    <a href="langkah.html" class="btn">📖 Langkah Demi Langkah Umrah</a>
    <a href="lain.html#nota" class="btn">📝 Nota Peribadi</a>
    <a href="lain.html#tasbih" class="btn">🕌 Tasbih Digital</a>
    <a href="belanjawan.html" class="btn">💰 Pengurusan Duit & Belanjawan</a>
    <a href="pindah.html" class="btn">📦 Pindah Data ke Peranti Lain</a>
    <div style="margin-top: 30px; padding-top: 20px; border-top: 1px solid #ccc;"></div>
    <a href="index.html" class="btn btn-back">🏠 Kembali ke Halaman Utama</a>
</div>


    <a href="index.html" class="btn btn-back fade-up">⬅️ Kembali ke Halaman Utama</a>
</body>
   

</html>
